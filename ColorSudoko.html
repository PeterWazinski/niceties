<html>
<head>
	<title>Color Sudoku</title>
</head>
<body>

 <fieldset>  <legend><a target="_blank" href="http://www.theguardian.com/books/2015/sep/17/nested-fish-and-golden-triangles-adult-colouring-and-the-beauty-of-maths">Color Sudoku Overlay </a> </legend>
 <input type="button" id="b1" name="bbb" value="Generate new!" onclick="drawOverlay();">
 &nbsp;&nbsp;&nbsp; Print Numbers<input type="checkbox" id="c1" name="with" value="Print Numbers" >
 
 </fieldset> 


<div align="center" > 
<br><br><br><br>
<canvas id="canvas1" width="675" height="675" style="border:solid 1px">
</canvas>
</div>

<script type="text/javascript">

if(!Sudoku) var Sudoku = { };

Sudoku.generate = function(){
	//debugger;

	var ovl = Sudoku.gridOverlay();

	var grid1 = new Sudoku.Grid();
	Sudoku.fillCell(0, grid1, ovl);

	var grid2 = new Sudoku.Grid();
	Sudoku.fillCell(0, grid2, ovl);

	var grid3 = new Sudoku.Grid();
	Sudoku.fillCell(0, grid3, ovl);

	return [grid1, grid2, grid3];
}


Sudoku.fillCell = function (n, grid, overlay){

	if (n == 81) {
		// console.log("ready");
		return true;
	}

	var row = Math.floor(n / 9),
		col = n - (row * 9),
		vals = grid.randomValueSet();	

	for (var i = 0; i < vals.length; i++) {
			var val = vals[i];

			var ovlOK = Sudoku.validOverlay(val, row, col, overlay);
			if (ovlOK){
				Sudoku.setOverlay(val, row, col, overlay);
			} else {
				//debugger;
				//console.log("skip because of overlay violation", n, val, row, col);
				continue;
			}

			if (grid.validValue(val, row, col)){
				grid.setCell(val, row, col);

				if (Sudoku.fillCell(n+1, grid, overlay) == true) {;
					return true;
				} 
			}
			Sudoku.resetOverlay(val, row, col, overlay);
		};
	
	grid.setCell(0, row, col);
	
	//console.log("backtrack: no val found at pos ", n, row, col, "valset=", vals.toString());	

	return false;
}

Sudoku.gridOverlay = function(){
		var gridOverlay = [];

		for(var row = 0; row < 9; row++)
		{	var overlayCols = [];
			for(var col = 0; col < 9; col++){
				overlayCols[col] = {};
			}	
			gridOverlay[row] = overlayCols;
		}
		return gridOverlay;
	};

Sudoku.setOverlay = function(value, row, column, gridOverlay) {
		gridOverlay[row][column][value] = true;
	};
	
Sudoku.resetOverlay = function(value, row, column, gridOverlay) {
		gridOverlay[row][column][value] = false;
	};

Sudoku.validOverlay = function(value, row, column, gridOverlay) {
		return gridOverlay[row][column][value] == undefined 
		       || gridOverlay[row][column][value] == false;
	};


Sudoku.Grid =  function() {

	this.rows = [];

	for(var row = 0; row < 9; row++)
	{
		var cols = [];
		for(var col = 0; col < 9; col++)
			cols[col] = 0;
			
		this.rows[row] = cols;
	}

	this.squareSets = [[{},{},{}],
					  [{},{},{}],
					  [{},{},{}]];

	this.rowSets = [{},{},{},
		 		   {},{},{},
				   {},{},{}];

	this.colSets = [{},{},{},
				   {},{},{},
				   {},{},{}];

};

Sudoku.Grid.prototype = {
	rows: [],
	rowsets: [],
	columnSets: [],
	squareSets: [],
	
	getCell: function(row, col) {
		return this.rows[row][col];
	},
	
	setCell: function(newValue, row, column) {

		var oldValue = this.rows[row][column];

		this.rows[row][column] = newValue;

        this.rowSets[row][oldValue] = false;
		this.rowSets[row][newValue] = true;

		this.colSets[column][oldValue] = false;
		this.colSets[column][newValue] = true;

		var sqCol = Math.floor(column/3),
			sqRow = Math.floor(row/3);
		this.squareSets[sqRow][sqCol][oldValue] = false;
		this.squareSets[sqRow][sqCol][newValue] = true;	
	},

	insideRow: function (value, row){
		return this.rowSets[row][value] == true;
	},

	insideColumn: function (value, column){
		return this.colSets[column][value] == true;
	},

	insideSquare: function (value, row, column){
		var sqCol = Math.floor(column/3),
			sqRow = Math.floor(row/3);
		
		return this.squareSets[sqRow][sqCol][value] == true;
	},

	validValue: function(value, row, column){
		return     !this.insideRow(value, row)
				&& !this.insideColumn(value, column)
				&& !this.insideSquare(value, row, column);
	},

	toString: function() {
		var str = '\r\n';
		for(var i = 0; i < 9; i++)
		{
			str += this.rows[i].join(' ') + "\r\n";
		}
		
		return str;
	},

	randomValueSet: function (){

		var vals = [1,2,3,4,5,6,7,8,9];
	
		// shuffle

	    for (var i = vals.length - 1; i > 0; i--) {
	        var j = Math.floor(Math.random() * (i + 1));
	        var temp = vals[i];
	        vals[i] = vals[j];
	        vals[j] = temp;
	    }
	    return vals;
	}
	
};


</script>

<script type="text/javascript">
	
	var canvas = document.getElementById("canvas1");
	var ctx = canvas.getContext("2d");
	var colors = {1: "#6495ED", 2:"#FF7F50", 3:"#008B8B",
				  4: "#FF69B4", 5:"#90EE90", 6:"#7B68EE", //10CEA9
				  7: "#FFA500", 8:"#DDA0DD", 9:"#FFD700"};
	var stretchPX=15;
	

function drawOverlay(){

	var sudokus = Sudoku.generate();
	var checked = document.getElementById("c1").checked == true;
	
    ctx.clearRect(0, 0, canvas.width, canvas.height);
	for (var n = 0; n < 3; n++) {
	  	var su = sudokus[n];
		drawRectangles(checked, n, stretchPX, colors, su);	
	};

}
drawOverlay();
	
function drawRectangles(drawNum, rectSize, stretch, palette, sudoku){

	// rectSize = 0 large ,1 medium , 2 small

	//console.log("--------------------------------------------");
	//console.log(sudoku.toString());

		for (var j = 0; j < 9; j++) {
			for (var i = 0; i < 9; i++) {
				
				var val = sudoku.getCell(i,j);
				cellcolor = palette[val];
				ctx.fillStyle = cellcolor;
				var yc=(j*5+rectSize)*stretch, 
					xc=(i*5+rectSize)*stretch,
					height= width= (5 - 2* rectSize) *stretch;

				ctx.fillRect(xc,yc,width,height);
				
				if (drawNum){
					ctx.fillStyle = "black";
				    ctx.fillText(val, xc, yc+10);
				}
			 };	
			//return;
		}
}




</script>

</body>
