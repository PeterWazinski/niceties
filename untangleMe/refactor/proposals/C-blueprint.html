<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Untangle Me – Proposal C: Blueprint</title>
<style>
  :root { --bg:#0d3b66; --bg2:#0a2f52; --grid:rgba(255,255,255,.09); --grid2:rgba(255,255,255,.2);
          --ink:#e8f3ff; --dim:#8fb4d8; --edge:#cfe6ff; --bad:#ffd23f; --ok:#6ef0b0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); background:var(--bg2);
         font:15px/1.4 "Consolas","Courier New",monospace; }
  .wrap { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  .titleblock { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
                border:2px solid var(--ink); padding:10px 16px; margin-bottom:16px; }
  h1 { margin:0; font-size:24px; letter-spacing:.2em; text-transform:uppercase; }
  .titleblock span { color:var(--dim); }
  .layout { display:grid; grid-template-columns:1fr 240px; gap:16px; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }
  .sheet { position:relative; border:2px solid var(--ink);
           background:
             linear-gradient(var(--grid2) 1px,transparent 1px) 0 0/80px 80px,
             linear-gradient(90deg,var(--grid2) 1px,transparent 1px) 0 0/80px 80px,
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/16px 16px,
             linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/16px 16px, var(--bg); }
  svg { display:block; width:100%; height:auto; touch-action:none; }
  .edge { stroke:var(--edge); stroke-width:1.6; transition:stroke .15s; }
  .edge.x { stroke:var(--bad); stroke-width:2.2; }
  .node { fill:var(--bg); stroke:var(--edge); stroke-width:2.2; cursor:grab; }
  .node.x { stroke:var(--bad); }
  .node.grab { cursor:grabbing; fill:var(--edge); }
  .mark { fill:none; stroke:var(--bad); stroke-width:2; pointer-events:none; }
  body[data-solved=true] .edge, body[data-solved=true] .node { stroke:var(--ok); }
  aside { border:2px solid var(--ink); padding:14px; }
  aside h3 { margin:0 0 10px; font-size:12px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase;
             border-bottom:1px dashed var(--dim); padding-bottom:6px; }
  .row { display:flex; justify-content:space-between; padding:5px 0; }
  .row b { font-size:20px; }
  .row.cross b { color:var(--bad); }
  body[data-solved=true] .row.cross b { color:var(--ok); }
  .stamp { display:none; margin:14px 0 0; border:3px double var(--ok); color:var(--ok); text-align:center;
           padding:8px; transform:rotate(-4deg); font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  body[data-solved=true] .stamp { display:block; }
  .field { margin-top:16px; }
  .field label { display:block; color:var(--dim); font-size:12px; margin-bottom:4px; }
  input[type=range] { width:100%; accent-color:var(--bad); }
  button { width:100%; margin-top:10px; padding:10px; font:inherit; background:transparent;
           color:var(--ink); border:2px solid var(--ink); cursor:pointer; text-transform:uppercase; letter-spacing:.14em; }
  button.primary { background:var(--ink); color:var(--bg); }
  button:hover { border-color:var(--bad); }
  .legend { margin-top:16px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:18px; height:0; border-top:2px solid; vertical-align:middle; margin-right:6px; }
</style></head>
<body>
<div class="wrap">
  <div class="titleblock">
    <h1>Untangle Me</h1>
    <span>DWG 01 · PLANAR GRAPH · SHEET 1/1 · mock-up (drag works)</span>
  </div>
  <div class="layout">
    <div class="sheet"><svg id="board" preserveAspectRatio="xMidYMid meet"></svg></div>
    <aside>
      <h3>Measurements</h3>
      <div class="row"><span>TIME</span><b><span data-bind="timer">0.0</span> s</b></div>
      <div class="row"><span>MOVES</span><b data-bind="moves">0</b></div>
      <div class="row cross"><span>CROSSINGS</span><b data-bind="cross">0</b></div>
      <div class="stamp">Approved<br><small><span data-bind="timer">0.0</span> s</small></div>
      <div class="field"><h3 style="margin-top:18px">Parameters</h3>
        <label>VERTICES n = 8</label><input type="range" min="4" max="30" value="8">
        <label style="margin-top:10px">EDGE DENSITY 60 %</label><input type="range" min="0" max="100" value="60">
      </div>
      <button class="primary" id="new">New sheet</button>
      <button id="demo">Show solution</button>
      <div class="legend"><i style="color:var(--edge)"></i>clear &nbsp; <i style="color:var(--bad)"></i>crossing</div>
    </aside>
  </div>
</div>
<script src="mock.js"></script>
</body></html>
