            var angle = Math.floor(Math.random() * 360);
            var speed = Math.floor(Math.random() * spd / 2) + spd;
            var life = Math.floor(Math.random() * lif) + lif / 2;
            var radians = angle * Math.PI / 180;
            var xunits = Math.cos(radians) * speed;
            var yunits = Math.sin(radians) * speed;

            if (this.particlePool.length > 0) {
              var tempParticle = this.particlePool.pop();
              tempParticle.x = x;
              tempParticle.y = y;
              tempParticle.xunits = xunits;
              tempParticle.yunits = yunits;
              tempParticle.life = life;
              tempParticle.color = color;
              tempParticle.width = width;
              tempParticle.height = height;
              tempParticle.gravity = grav;
              tempParticle.moves = 0;
              tempParticle.alpha = 1;
              tempParticle.maxLife = life;
              this.particles.push(tempParticle);
            } else {
              this.particles.push({
                x: x,
                y: y,
                xunits: xunits,
                yunits: yunits,
                life: life,
                color: color,
                width: width,
                height: height,
                gravity: grav,
                moves: 0,
                alpha: 1,
                maxLife: life
              });
            }

          }
        }
      });



      // ###################################################################
      // Effects: screen shake, screen flash and expanding explosion flashes
      //
      // ###################################################################
      function createEffects() {
        return {
          shakeTime: 0,
          shakeMax: 0.001,
          shakeMag: 0,
          screenColor: '#ffffff',
          screenAlpha: 0,
          flashes: []
        };
      }

      function shakeScreen(magnitude, seconds) {
        effects.shakeMag = magnitude;
        effects.shakeTime = effects.shakeMax = seconds;
      }

      function flashScreen(color, alpha) {
        effects.screenColor = color;
        effects.screenAlpha = alpha;
      }

      function addFlash(x, y, color, radius, seconds) {
        effects.flashes.push({ x: x, y: y, color: color, radius: radius, life: seconds, maxLife: seconds });
      }

      function updateEffects(dt) {
        effects.shakeTime = Math.max(0, effects.shakeTime - dt);
        effects.screenAlpha = Math.max(0, effects.screenAlpha - dt * 1.8);
        for (var i = effects.flashes.length - 1; i >= 0; i--) {
          effects.flashes[i].life -= dt;
          if (effects.flashes[i].life <= 0) effects.flashes.splice(i, 1);
        }
      }

      // translation of the whole scene while the screen shakes (decays linearly)
      function applyShake() {
        if (effects.shakeTime <= 0) return;
        var m = effects.shakeMag * (effects.shakeTime / effects.shakeMax);
        ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
      }

      function drawFlashes() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (var i = 0; i < effects.flashes.length; i++) {
          var f = effects.flashes[i];
          var t = 1 - f.life / f.maxLife; // 0 -> 1
          var r = f.radius * (0.35 + 0.65 * t);
          var g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
          g.addColorStop(0, '#ffffff');
          g.addColorStop(0.35, f.color);
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = (1 - t) * (1 - t);
          ctx.fillStyle = g;
          ctx.fillRect(f.x - r, f.y - r, r * 2, r * 2);
        }
        ctx.restore();
      }

      function drawScreenFlash() {
        if (effects.screenAlpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.min(1, effects.screenAlpha);
        ctx.fillStyle = effects.screenColor;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        ctx.restore();
      }



      // ###################################################################
      // Initialization functions
      //
      // ###################################################################
      function initCanvas() {
        // create our canvas and context
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');

        // turn off image smoothing
        setImageSmoothing(false);

        // create our main sprite sheet img
        //spriteSheetImg = new Image();
        //spriteSheetImg.src = SPRITE_SHEET_SRC;

        ne107spriteSheetImg = new Image();
        ne107spriteSheetImg.src = ne107Sprites;

        healthplayerspriteSheetImg = new Image();
        healthplayerspriteSheetImg.src = healthplayerSprite;

        preDrawImages();

        // add event listeners and initially resize
        window.addEventListener('resize', resize);
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
      }

      function preDrawImages() {
        var canvas = drawIntoCanvas(2, 8, function (ctx) {
          ctx.fillStyle = 'white';
          ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        });
        bulletImg = new Image();
        bulletImg.src = canvas.toDataURL();

        healBulletImg = new Image();
        healBulletImg.src = drawIntoCanvas(3, 10, function (ctx) {
          ctx.fillStyle = GOOD_COLOR;
          ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }).toDataURL();

        alienBulletImg = new Image();
        alienBulletImg.src = drawIntoCanvas(3, 10, function (ctx) {
          ctx.fillStyle = '#ff5a3c';
          ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
        }).toDataURL();
      }

      function setImageSmoothing(value) {
        this.ctx['imageSmoothingEnabled'] = value;
        this.ctx['mozImageSmoothingEnabled'] = value;
        this.ctx['oImageSmoothingEnabled'] = value;
        this.ctx['webkitImageSmoothingEnabled'] = value;
        this.ctx['msImageSmoothingEnabled'] = value;
      }

      function initGame() {
        aliens = [];
        wave = 1;
        alienDirection = -1;
        alienYDown = 0;
        updateAlienLogic = false;
        gameOver = false;
        healedCount = 0;
        effects = createEffects();
        player = new Player();
        particleManager = new ParticleExplosion();
        setupAlienFormation();
        drawBottomHud();
      }

      function setupAlienFormation() {
        alienCount = 0;
        for (var i = 0, len = 5 * 11; i < len; i++) {
          var gridX = (i % 11);
          var gridY = Math.floor(i / 11);
          // row 0-1: maintenance required, 2-3: out of specification, 4: failure ... and
          // every second wave all devices are one severity step worse
          var baseHits = (gridY < 2) ? 1 : (gridY < 4) ? 2 : 3;
          var hits = Math.min(MAX_HITS, baseHits + Math.floor((wave - 1) / 2));
          aliens.push(new Enemy(hits, (CANVAS_WIDTH / 2 - ALIEN_SQUAD_WIDTH / 2) + ALIEN_X_MARGIN / 2 + gridX *
            ALIEN_X_MARGIN, CANVAS_HEIGHT / 3.25 - gridY * 40));
          alienCount++;
        }
      }

      function endGame() {
        hasGameStarted = false;
        gameOver = true;
      }

      function init() {
        initCanvas();
        keyStates = [];
        prevKeyStates = [];
        resize();
      }



      // ###################################################################
      // Helpful input functions
      //
      // ###################################################################
      function isKeyDown(key) {
        return keyStates[key];
      }

      function wasKeyPressed(key) {
        return !prevKeyStates[key] && keyStates[key];
      }


      // ###################################################################
      // Drawing & Update functions
      //
      // ###################################################################
      function updateAliens(dt) {
        if (updateAlienLogic) {
          updateAlienLogic = false;
          alienDirection = -alienDirection;
          alienYDown = 25;
        }

        for (var i = aliens.length - 1; i >= 0; i--) {
          var alien = aliens[i];
          if (!alien.alive) {
            aliens.splice(i, 1);
            alien = null;
            continue;
          }

          alien.stepDelay = ((alienCount * 20) - (wave * 10)) / 1000;
          if (alien.stepDelay <= 0.05) {
            alien.stepDelay = 0.05;
          }
          alien.update(dt);

          if (alien.doShoot) {
            alien.doShoot = false;
            alien.shoot();
          }
        }
        alienYDown = 0;

        if (hasGameStarted && alienCount < 1) {
          wave++;
          setupAlienFormation();
        }
      }

      function resolveBulletEnemyCollisions() {
        var bullets = player.bullets;

        for (var i = 0, len = bullets.length; i < len; i++) {
          var bullet = bullets[i];
          if (!bullet.alive) continue;
          for (var j = 0, alen = aliens.length; j < alen; j++) {
            var alien = aliens[j];
            if (alien.healed || !alien.alive) continue;
            if (checkRectCollision(bullet.bounds, alien.bounds)) {
              bullet.alive = false;
              var oldColor = NAMUR_STATES[alien.hits - 1].color;
              var x = alien.position.x, y = alien.position.y;
              if (alien.heal()) {
                // device is good again
                alienCount--;
                healedCount++;
                player.score += 25 * alien.maxHits;
                particleManager.createExplosion(x, y, GOOD_COLOR, 50, 4, 4, 2.5, -0.04, 55);
                addFlash(x, y, GOOD_COLOR, 70, 0.5);
              } else {
                // one step better
                player.score += 10;
                particleManager.createExplosion(x, y, oldColor, 24, 4, 4, 3, .1, 35);
                addFlash(x, y, oldColor, 40, 0.28);
              }
              break;
            }
          }
        }
      }

      function resolveBulletPlayerCollisions() {
        for (var i = 0, len = aliens.length; i < len; i++) {
          var alien = aliens[i];
          if (alien.bullet !== null && checkRectCollision(alien.bullet.bounds, player.bounds)) {
            if (player.lives === 0) {
              endGame();
              break;
            } else {
              alien.bullet.alive = false;
              particleManager.createExplosion(player.position.x, player.position.y, 'green', 100, 8, 8, 6, 0.001, 40);
              addFlash(player.position.x, player.position.y, '#ff5a3c', 110, 0.45);
              shakeScreen(12, 0.45);
              flashScreen('#ff2a2a', 0.5);
              player.position.set(CANVAS_WIDTH / 2, CANVAS_HEIGHT - 70);
              player.lives--;
              break;
            }

          }
        }
      }

      function resolveCollisions() {
        resolveBulletEnemyCollisions();
        resolveBulletPlayerCollisions();
      }

      function updateGame(dt) {
        player.handleInput();
        prevKeyStates = keyStates.slice();
        player.update(dt);
        updateAliens(dt);
        resolveCollisions();
        updateEffects(dt);
      }

      function drawIntoCanvas(width, height, drawFunc) {
        var canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        var ctx = canvas.getContext('2d');
        drawFunc(ctx);
        return canvas;
      }

      function fillText(text, x, y, color, fontSize) {
        if (typeof color !== 'undefined') ctx.fillStyle = color;
        if (typeof fontSize !== 'undefined') ctx.font = fontSize + 'px Play';
        ctx.fillText(text, x, y);
      }

      function fillCenteredText(text, x, y, color, fontSize) {
        if (typeof fontSize !== 'undefined') ctx.font = fontSize + 'px Play';
        var metrics = ctx.measureText(text);
        fillText(text, x - metrics.width / 2, y, color);
      }

      function fillBlinkingText(text, x, y, blinkFreq, color, fontSize) {
        if (~~(0.5 + Date.now() / blinkFreq) % 2) {
          fillCenteredText(text, x, y, color, fontSize);
        }
      }

      function drawBottomHud() {
        ctx.fillStyle = '#02ff12';
        ctx.fillRect(0, CANVAS_HEIGHT - 30, CANVAS_WIDTH, 2);
        fillText(player.lives + ' x ', 10, CANVAS_HEIGHT - 7.5, 'white', 20);
        ctx.drawImage(healthplayerspriteSheetImg, player.clipRect.x, player.clipRect.y, player.clipRect.w,
          player.clipRect.h, 45, CANVAS_HEIGHT - 23, player.clipRect.w * 0.5,
          player.clipRect.h * 0.5);
        fillText('CREDIT: ', CANVAS_WIDTH - 115, CANVAS_HEIGHT - 7.5);
        fillCenteredText('HEALTHSCORE: ' + player.score + '    WAVE ' + wave + '    HEALED ' + healedCount, CANVAS_WIDTH / 2, 20);
        fillBlinkingText('00', CANVAS_WIDTH - 25, CANVAS_HEIGHT - 7.5, TEXT_BLINK_FREQ);
      }

      function drawAliens(resized) {
        for (var i = 0; i < aliens.length; i++) {
          var alien = aliens[i];
          alien.draw(resized);
        }
      }

      function drawGame(resized, dt) {
        ctx.save();
        applyShake();
        player.draw(resized);
        drawAliens(resized);
        particleManager.draw(dt);
        drawFlashes();
        drawBottomHud();
        ctx.restore();
        drawScreenFlash();
      }

      function drawStartScreen() {
        fillCenteredText("Health Invaders", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2.75 - (gameOver ? 50 : 0), '#FFFFFF', 36);
        if (gameOver) {
          fillCenteredText("GAME OVER - HEALTHSCORE: " + player.score + "  (WAVE " + wave + ")", CANVAS_WIDTH / 2,
            CANVAS_HEIGHT / 2.2 - 50, '#FF5555', 20);
        }
        fillBlinkingText("Press enter to play!", CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 500, '#FFFFFF', 36);
        fillCenteredText("Move with arrows, heal up with <space>", CANVAS_WIDTH / 2, CANVAS_HEIGHT - 30, 'white', 20);
      }

      function animate() {
        var now = window.performance.now();
        var dt = now - lastTime;
        if (dt > 100) dt = 100;
        if (wasKeyPressed(13) && !hasGameStarted) {
          initGame();
          hasGameStarted = true;
        }

        if (hasGameStarted) {
          updateGame(dt / 1000);
        }


        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        if (hasGameStarted) {
          drawGame(false, dt / 1000);
        } else {
          drawStartScreen();
        }
        lastTime = now;
        requestAnimationFrame(animate);
      }



      // ###################################################################
      // Event Listener functions
      //
      // ###################################################################
      function resize() {
        var w = window.innerWidth;
        var h = window.innerHeight;

        // calculate the scale factor to keep a correct aspect ratio
        var scaleFactor = Math.min(w / CANVAS_WIDTH, h / CANVAS_HEIGHT);

        if (IS_CHROME) {
          canvas.width = CANVAS_WIDTH * scaleFactor;
          canvas.height = CANVAS_HEIGHT * scaleFactor;
          setImageSmoothing(false);
          ctx.transform(scaleFactor, 0, 0, scaleFactor, 0, 0);
        } else {
          // resize the canvas css properties
          canvas.style.width = CANVAS_WIDTH * scaleFactor + 'px';
          canvas.style.height = CANVAS_HEIGHT * scaleFactor + 'px';
        }
      }

      function onKeyDown(e) {
        if (GAME_KEYS.indexOf(e.keyCode) >= 0) e.preventDefault();
        keyStates[e.keyCode] = true;
      }

      function onKeyUp(e) {
        if (GAME_KEYS.indexOf(e.keyCode) >= 0) e.preventDefault();
        keyStates[e.keyCode] = false;
      }


      // ###################################################################
      // Start game!
      //
      // ###################################################################
      window.onload = function () {
        init();
        animate();
      };
    </script>
  </head>

  <body>
    <link href='https://fonts.googleapis.com/css?family=Play:400,700' rel='stylesheet' type='text/css'>
    <canvas id="game-canvas" width="640" height="640"></canvas>
  </body>
